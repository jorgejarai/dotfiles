// Vendored from https://github.com/quiltedhills/good-girl (GPLv3)
// first line is required to be comment

(function() {
    // Woke
    const PRONOUNS = {
        boy: {
            dropdownLabel: "He/Him", // The text that should appear in the settings' dropdown
            kitMessage: "Good boy.", // The text that should appear in the Default Browser screen with this pronoun selected
            fakeAccessChar: "H"      // An optional character to underline in `dropdownLabel`, as if it was a cool-looking access key :p
        },
        girl: {
            dropdownLabel: "She/Her",
            kitMessage: "Good girl.",
            fakeAccessChar: "S"
        },
        enby: {
            dropdownLabel: "They/Them",
            kitMessage: "Good bean.",
            fakeAccessChar: "T"
        },
        other: {
            dropdownLabel: "Other",
            kitMessage: "Good pet."
        }
    }

    const CONFIG = {
        // The ID name for the base Firefox settings group that pronouns should come after.
        // This lets you reposition the Pronouns group, with a bit of work!
        // You can find these with Inspect Element and a bit of trial and error.
        positionGroupId: 'account',

        // Where clicking 'Learn More' at the pronouns toggle will take you to
        learnMoreLink: "https://www.reddit.com/r/countwithchickenlady/comments/1u0m0zx/54397/",
    }

    const LANG_TEMPLATE = (browserName) => {
        return {
            pronounsGroupLabel: "Pronouns",
            pronounsToggleLabel: `Choose how ${browserName} refers to you.`,
            pronounsSillyToggleLabel: "Use silly cat faces",
            learnMoreText: "Learn more", // Make this a blank string ("") to not display a clickable link
            baseKitMessage: `${browserName} is your default browser.`,
            baseKitPraise: "Good choice."
        }
    }



    let LANG = null

    // "Good choice" message replacer
    Services.obs.addObserver({
        // I could probably add a state thing and an async thing to the `updateKitMessage()` function itself
        // but I'm feeling a little lazy
        observe(subject, topic) {
            if (topic != "chrome-document-global-created") return
            if (!subject.location.href.startsWith("about:preferences")) return

            const observer = new subject.MutationObserver(() => {
                if (updateKitMessage(subject)) observer.disconnect()
            })

            observer.observe(subject.document, {
                childList: true,
                subtree: true
            })
        }
    }, "chrome-document-global-created")

    // Add and manage pronoun settings
    Services.obs.addObserver({
        observe(subject, topic) {
            if (topic != "chrome-document-global-created") return
            if (!subject.location.href.startsWith("about:preferences")) return

            const observer = new subject.MutationObserver(() => {
                if (subject.document.querySelector("#pronouns-group")) return // don't make group again

            const browserName = subject.window.AppConstants.MOZ_APP_BASENAME
            LANG = LANG_TEMPLATE(browserName)

            // Page location anchor
                const relativePositionGroup = subject.document.querySelector(`setting-group[groupid=${CONFIG.positionGroupId}]`)
                if (!relativePositionGroup) return

            // Settings group init
                const group = subject.document.createElement("setting-group")
                group.id = "pronouns-group"
                const card = subject.document.createElement("moz-card")
                card.setAttribute("type", "default")


            // Fieldset and header
                const fieldset = subject.document.createElement("moz-fieldset")
                const fakeHeading = subject.document.createElement("h3") // I couldn't figure out a better way to make the heading
                fakeHeading.className = "text-box-trim-start"
                fakeHeading.textContent = LANG.pronounsGroupLabel
                card.appendChild(fakeHeading)

            // Checkbox
                const checkbox = subject.document.createElement("moz-checkbox")
                checkbox.setAttribute("label", LANG.pronounsToggleLabel)
                applyLearnMore(subject, checkbox, "label")
                checkbox.setAttribute("accesskey", "C")

                const checkboxControl = subject.document.createElement("setting-control")
                checkboxControl.appendChild(checkbox)

            // Sillier checkbox :3
                const sillyCheckbox = subject.document.createElement("moz-checkbox")
                sillyCheckbox.setAttribute("label", LANG.pronounsSillyToggleLabel)
                sillyCheckbox.setAttribute("accesskey", "U")

                const sillyCheckboxControl = subject.document.createElement("setting-control")
                sillyCheckboxControl.appendChild(sillyCheckbox)

            // Dropdown
                const select = subject.document.createElement("moz-select")

                // Create all fields
                for (const [option, data] of Object.entries(PRONOUNS)) {
                    const entry = subject.document.createElement("moz-option")
                    entry.value = option

                    let labelText = (data.fakeAccessChar) // Underline
                        ? data.dropdownLabel.replace(data.fakeAccessChar, `\u0332${data.fakeAccessChar}\u0332`)
                        : data.dropdownLabel
                    entry.setAttribute("label", labelText)

                    select.append(entry)
                }

                const selectControl = subject.document.createElement("setting-control")
                selectControl.appendChild(select)

            // Finalizing
                // Restore saved values for checkbox and dropdown
                const states = readStates()
                checkbox.checked = states.pronounsCheckbox
                select.disabled = !states.pronounsCheckbox
                select.value = states.dropdown
                sillyCheckbox.checked = states.sillyCheckbox

                // Add checkbox and dropdown event listeners
                checkbox.addEventListener("change", () => {
                    select.disabled = !checkbox.checked
                    writeState(subject, select, sillyCheckbox)
                })
                select.addEventListener("change", () => {
                    writeState(subject, select, sillyCheckbox)
                })
                sillyCheckbox.addEventListener("change", () => {
                    writeState(subject, select, sillyCheckbox)
                })

                // Put everything together
                fieldset.append(checkboxControl, selectControl, sillyCheckboxControl)
                card.appendChild(fieldset)
                group.appendChild(card)
                relativePositionGroup.after(group)
            })

            observer.observe(subject.document, {
                childList: true,
                subtree: true
            })
        }
    }, "chrome-document-global-created")



    // Appends a hyperlink to the checkbox text
    function applyLearnMore(subject, element, attribute = "label") {
        if (!LANG.learnMoreText) return

        // I did this as a post-edit, you can probably do it inline as well but weh
        subject.setTimeout(() => {
            const label = element.shadowRoot?.querySelector(attribute)
            if (!label) return

            const link = subject.document.createElement("a")
            link.href = CONFIG.learnMoreLink
            link.target = "_blank"
            link.textContent = LANG.learnMoreText

            label.append(" ", link)
        }, 1)
    }

    // Updates the Default Browser message
    function updateKitMessage(subject) {
        const promo = subject.document.querySelector("moz-promo#isDefaultPane")
        if (!promo) return false

        let states = readStates()
        let praise = (states.pronounsCheckbox) ? PRONOUNS[states.dropdown].kitMessage : LANG.baseKitPraise

        let constructedMessage = `${LANG.baseKitMessage} ${praise}`
        if (states.sillyCheckbox) {
            if (constructedMessage.endsWith('.')) // Remove trailing period
                constructedMessage = constructedMessage.substring(0, constructedMessage.length - 1)

            constructedMessage = `${constructedMessage} :3` // Append cat
        }

        promo.removeAttribute("data-l10n-id") // Make it so Firefox doesn't try to read `.fl` lang data, allowing manual message setting
        promo.setAttribute("message", constructedMessage)

        return true
    }

    // Persistent data, stored as `about:config` values
    const PREFKEYS = {
        TOGGLE: 'veryrealsettings.pronouns.toggle',
        DROPDOWN: 'veryrealsettings.pronouns.dropdown',
        SILLY_TOGGLE: 'veryrealsettings.pronouns.silly-toggle'
    }

    function writeState(subject, select, sillyCheckbox) {
        Services.prefs.setBoolPref(PREFKEYS.TOGGLE, !select.disabled)
        Services.prefs.setStringPref(PREFKEYS.DROPDOWN, select.value)
        Services.prefs.setBoolPref(PREFKEYS.SILLY_TOGGLE, sillyCheckbox.checked)
        updateKitMessage(subject)
    }

    function readStates() {
        return {
            pronounsCheckbox: Services.prefs.getBoolPref(PREFKEYS.TOGGLE, false),
            dropdown: Services.prefs.getStringPref(PREFKEYS.DROPDOWN, 'other'),
            sillyCheckbox: Services.prefs.getBoolPref(PREFKEYS.SILLY_TOGGLE, false)
        }
    }
})()
